name: envoy-h2-lab
x-app: &app
  build: .
  image: envoy-h2-lab-tools:local
x-tap: &tap
  <<: *app
  command: ["python", "-c", "import signal; signal.pause()"]
  cap_drop: [ALL]
  cap_add: [NET_RAW, SETUID, SETGID]
  volumes: ["./captures:/captures"]
services:
  envoy:
    labels: {lab.config.version: "http-front-1"}
    image: envoyproxy/envoy:v1.36-latest
    command: ["-c", "/etc/envoy/lab.yaml", "--concurrency", "1"]
    volumes: ["./envoy.yaml:/etc/envoy/lab.yaml:ro"]
    networks: [front, middle, back]
  mitm:
    image: mitmproxy/mitmproxy:12.3.1
    entrypoint: ["python", "-c", "import signal; signal.pause()"]
    networks: [middle, back]
    volumes: ["./captures:/captures", "./mitm_run.py:/lab/mitm_run.py:ro"]
  tap-mitm:
    <<: *tap
    network_mode: "service:mitm"
  reverse:
    image: nginx:stable-alpine
    depends_on: [origin]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [middle, back]
  origin:
    <<: *app
    command: ["python", "origin.py"]
    networks: [back]
  tap-front:
    <<: *tap
    network_mode: "service:envoy"
  tap-middle:
    <<: *tap
    network_mode: "service:reverse"
  tap-back:
    <<: *tap
    network_mode: "service:origin"
  ui:
    <<: *app
    command: ["python", "ui.py"]
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "./captures:/captures"]
    depends_on: [tap-front, tap-middle, tap-back, tap-mitm]
networks:
  front: {}
  middle: {}
  back: {}
