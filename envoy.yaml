{
  "static_resources": {
    "listeners": [
      {
        "name": "front",
        "address": {
          "socket_address": {
            "address": "0.0.0.0",
            "port_value": 10000
          }
        },
        "filter_chains": [
          {
            "filters": [
              {
                "name": "envoy.filters.network.http_connection_manager",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
                  "stat_prefix": "lab",
                  "use_remote_address": true,
                  "route_config": {
                    "name": "lab",
                    "virtual_hosts": [
                      {
                        "name": "lab",
                        "domains": [
                          "*"
                        ],
                        "routes": [
                          {
                            "match": {
                              "prefix": "/",
                              "headers": [
                                {
                                  "name": "x-lab-route",
                                  "string_match": {
                                    "safe_regex": {"regex": "reverse-h2(-keep)?"}
                                  }
                                }
                              ]
                            },
                            "route": {
                              "cluster": "reverse-h2"
                            }
                          },
                          {
                            "match": {
                              "prefix": "/",
                              "headers": [
                                {
                                  "name": "x-lab-route",
                                  "string_match": {
                                    "exact": "reverse-h1"
                                  }
                                }
                              ]
                            },
                            "route": {
                              "cluster": "reverse-h1"
                            }
                          },
                          {
                            "match": {
                              "prefix": "/",
                              "headers": [
                                {
                                  "name": "x-lab-route",
                                  "string_match": {
                                    "exact": "origin-h1"
                                  }
                                }
                              ]
                            },
                            "route": {
                              "cluster": "origin-h1"
                            }
                          },
                          {
                            "match": {
                              "prefix": "/"
                            },
                            "route": {
                              "cluster": "reverse-h2"
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "http_filters": [
                    {
                      "name": "envoy.filters.http.router",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      },
      {
        "name": "url_connect",
        "address": {
          "socket_address": {
            "address": "0.0.0.0",
            "port_value": 10001
          }
        },
        "filter_chains": [
          {
            "filters": [
              {
                "name": "envoy.filters.network.http_connection_manager",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
                  "stat_prefix": "url_connect",
                  "upgrade_configs": [
                    {
                      "upgrade_type": "CONNECT"
                    }
                  ],
                  "route_config": {
                    "name": "url_routes",
                    "virtual_hosts": [
                      {
                        "name": "targets",
                        "domains": [
                          "*"
                        ],
                        "routes": [
                          {
                            "match": {
                              "connect_matcher": {}
                            },
                            "route": {
                              "cluster": "url_targets",
                              "timeout": "0s",
                              "upgrade_configs": [
                                {
                                  "upgrade_type": "CONNECT",
                                  "connect_config": {}
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "http_filters": [
                    {
                      "name": "envoy.filters.http.dynamic_forward_proxy",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig",
                        "dns_cache_config": {
                          "name": "url_targets",
                          "dns_lookup_family": "V4_PREFERRED"
                        }
                      }
                    },
                    {
                      "name": "envoy.filters.http.router",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ],
    "clusters": [
      {
        "name": "reverse-h2",
        "type": "STRICT_DNS",
        "connect_timeout": "2s",
        "load_assignment": {
          "cluster_name": "reverse-h2",
          "endpoints": [
            {
              "lb_endpoints": [
                {
                  "endpoint": {
                    "address": {
                      "socket_address": {
                        "address": "reverse",
                        "port_value": 8080
                      }
                    }
                  }
                }
              ]
            }
          ]
        },
        "typed_extension_protocol_options": {
          "envoy.extensions.upstreams.http.v3.HttpProtocolOptions": {
            "@type": "type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions",
            "common_http_protocol_options": {
              "idle_timeout": "1s"
            },
            "explicit_http_config": {
              "http2_protocol_options": {}
            }
          }
        }
      },
      {
        "name": "reverse-h1",
        "type": "STRICT_DNS",
        "connect_timeout": "2s",
        "load_assignment": {
          "cluster_name": "reverse-h1",
          "endpoints": [
            {
              "lb_endpoints": [
                {
                  "endpoint": {
                    "address": {
                      "socket_address": {
                        "address": "reverse",
                        "port_value": 8080
                      }
                    }
                  }
                }
              ]
            }
          ]
        },
        "typed_extension_protocol_options": {
          "envoy.extensions.upstreams.http.v3.HttpProtocolOptions": {
            "@type": "type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions",
            "common_http_protocol_options": {
              "idle_timeout": "1s"
            },
            "explicit_http_config": {
              "http_protocol_options": {}
            }
          }
        }
      },
      {
        "name": "origin-h1",
        "dns_refresh_rate": "1s",
        "type": "STRICT_DNS",
        "connect_timeout": "2s",
        "load_assignment": {
          "cluster_name": "origin-h1",
          "endpoints": [
            {
              "lb_endpoints": [
                {
                  "endpoint": {
                    "address": {
                      "socket_address": {
                        "address": "origin",
                        "port_value": 8000
                      }
                    }
                  }
                }
              ]
            }
          ]
        },
        "typed_extension_protocol_options": {
          "envoy.extensions.upstreams.http.v3.HttpProtocolOptions": {
            "@type": "type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions",
            "common_http_protocol_options": {
              "idle_timeout": "1s"
            },
            "explicit_http_config": {
              "http_protocol_options": {}
            }
          }
        }
      },
      {
        "name": "url_targets",
        "connect_timeout": "5s",
        "lb_policy": "CLUSTER_PROVIDED",
        "cluster_type": {
          "name": "envoy.clusters.dynamic_forward_proxy",
          "typed_config": {
            "@type": "type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig",
            "dns_cache_config": {
              "name": "url_targets",
              "dns_lookup_family": "V4_PREFERRED"
            }
          }
        }
      }
    ]
  }
}
