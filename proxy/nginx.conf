events {}
http {
  resolver 127.0.0.11 valid=1s ipv6=off;
  map "$http_x_lab_route:$server_protocol" $preserve_h2 {
    default 0;
    "reverse-h2-keep:HTTP/2.0" 1;
  }
  upstream origins {
    zone origins 64k;
    keepalive_timeout 1s;
    server origin:8000 resolve;
  }
  server {
    listen 8080;
    http2 on;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Reverse-Protocol $server_protocol;
    location / {
      error_page 418 = @preserve_h2;
      if ($preserve_h2) { return 418; }
      proxy_pass http://origins;
      proxy_http_version 1.1;
    }
    location @preserve_h2 {
      proxy_pass http://origins;
      proxy_http_version 2;
    }
  }
}
